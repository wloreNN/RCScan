[build-system]
requires = ["hatchling>=1.26,<1.27"]
build-backend = "hatchling.build"

[project]
name = "rcscan"
dynamic = ["version"]
description = "Cross-platform, scope-first vulnerability assessment platform"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "RCScan contributors" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.12,<1",
    "rich>=13.7,<15",
    "pydantic>=2.7,<3",
    "PyYAML>=6.0,<7",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9",
    "pytest-cov>=5,<7",
    "ruff>=0.6,<1",
    "mypy>=1.11,<2",
    "types-PyYAML>=6.0.12",
    "build>=1.2,<2",
    "twine>=5,<7",
]

[project.scripts]
rcscan = "rcscan.cli.main:app"

[tool.hatch.version]
path = "src/rcscan/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/rcscan"]
only-packages = true

[tool.hatch.build.targets.sdist]
include = [
    "/src/rcscan",
    "/tests",
    "/config",
    "/docs",
    "/scripts",
    "/pyproject.toml",
    "/README.md",
    "/LICENSE",
    "/SECURITY.md",
    "/CHANGELOG.md",
    "/.gitignore",
    "/.env.example",
]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
testpaths = ["tests"]

[tool.coverage.run]
source = ["rcscan"]
branch = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["rcscan"]
mypy_path = "src"
